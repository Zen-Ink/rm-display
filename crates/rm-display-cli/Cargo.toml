[package]
name = "rm-display-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["jpeg", "png"] }
prost = "0.12.6"
rand = "0.8"
rm-display-protocol = { path = "../rm-display-protocol" }
rm-display-transport = { path = "../rm-display-transport" }
serde_json = "1.0"
thiserror = "1.0"
zstd.workspace = true

[[bin]]
name = "rm-display-cli"
path = "src/main.rs"
